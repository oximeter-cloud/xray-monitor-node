services:
  remnanode:
    container_name: remnanode
    hostname: remnanode
    image: remnawave/node:latest
    network_mode: host
    restart: always
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    volumes:
      - ./certs:/var/lib/remnawave/configs/xray/ssl:ro
      - ./hosts:/etc/hosts:ro
      # Dedicated Docker named volume for Xray logs
      - xray_logs:/var/log/xray
    environment:
      - NODE_PORT=2222
      - SECRET_KEY="your_remnawave_secret_key"

  xray-monitor-node:
    container_name: xray-monitor-node
    hostname: xray-monitor-node
    image: ghcr.io/oximeter-cloud/xray-monitor-node:latest
    restart: always
    network_mode: host
    mem_limit: 80m
    environment:
      - MONITOR_URL=http://central-monitor-ip:9922  # Or https://monitor.example.com
      - INGEST_SECRET=your_secure_ingest_secret
      - NODE_NAME=DE1-Edge-Node                     # Name matching panel
      - NODE_ROLE=BRIDGE                            # BRIDGE or TUNNEL
      - XRAY_LOG_PATH=/var/log/xray/current
    volumes:
      # Read-only mount of the shared named volume
      - xray_logs:/var/log/xray:ro

volumes:
  xray_logs:
    name: xray_logs
